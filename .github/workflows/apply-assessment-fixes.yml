name: Apply assessment fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply assessment fixes') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch assessment app
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()

          s = s.replace('const STORAGE_KEY = "codiq-player-profile-v3";\nconst ADMIN_USERNAME', 'const STORAGE_KEY = "codiq-player-profile-v3";\nconst DRAFT_STORAGE_KEY = "codiq-assessment-draft-v1";\nconst ADMIN_USERNAME')
          s = s.replace('type AssessmentStatus = { isAdmin: boolean; canTakeAssessment: boolean; nextAssessmentAt: string | null };', 'type AssessmentStatus = { isAdmin: boolean; canTakeAssessment: boolean; nextAssessmentAt: string | null };\ntype AssessmentDraft = { questions: Question[]; current: number; selectedAnswers: number[]; feedbackVisible: boolean; feedbackCorrect: boolean; rawScores: Scores; review: ReviewItem[] };')
          s = s.replace('  const [serverReview, setServerReview] = useState<ReviewItem[]>([]);\n  const reviewRef', '  const [serverReview, setServerReview] = useState<ReviewItem[]>([]);\n  const [draftAvailable, setDraftAvailable] = useState(false);\n  const reviewRef')

          old = '  useEffect(() => { try { const saved = localStorage.getItem(STORAGE_KEY); if (saved) setProfile(JSON.parse(saved)); } catch { localStorage.removeItem(STORAGE_KEY); } }, []);'
          new = '''  useEffect(() => {\n    try {\n      const saved = localStorage.getItem(STORAGE_KEY);\n      if (saved) setProfile(JSON.parse(saved));\n      setDraftAvailable(Boolean(localStorage.getItem(DRAFT_STORAGE_KEY)));\n    } catch {\n      localStorage.removeItem(STORAGE_KEY);\n      localStorage.removeItem(DRAFT_STORAGE_KEY);\n    }\n  }, []);'''
          s = s.replace(old, new)

          marker = '  function addReviewItem(question: Question, selectedIndex: number) {'
          insert = '''  function resumeDraft() {\n    try {\n      const saved = localStorage.getItem(DRAFT_STORAGE_KEY);\n      if (!saved) return;\n      const draft: AssessmentDraft = JSON.parse(saved);\n      setQuizQuestions(draft.questions);\n      setCurrent(draft.current);\n      setSelectedAnswers(draft.selectedAnswers ?? []);\n      setFeedbackVisible(Boolean(draft.feedbackVisible));\n      setFeedbackCorrect(Boolean(draft.feedbackCorrect));\n      setRawScores(draft.rawScores ?? emptyScores());\n      reviewRef.current = draft.review ?? [];\n      setDraftAvailable(true);\n      setView("assessment");\n    } catch {\n      localStorage.removeItem(DRAFT_STORAGE_KEY);\n      setDraftAvailable(false);\n    }\n  }\n\n  function saveAndExit() {\n    if (!quizQuestions.length) return;\n    const draft: AssessmentDraft = { questions: quizQuestions, current, selectedAnswers, feedbackVisible, feedbackCorrect, rawScores, review: reviewRef.current };\n    localStorage.setItem(DRAFT_STORAGE_KEY, JSON.stringify(draft));\n    setDraftAvailable(true);\n    setView("home");\n  }\n\n'''
          if marker not in s: raise SystemExit('review marker missing')
          s = s.replace(marker, insert + marker, 1)

          old_start = '  async function startAssessment() {\n    setStatusMessage("");'
          new_start = '''  async function startAssessment() {\n    setStatusMessage("");\n    if (draftAvailable) { resumeDraft(); return; }'''
          if old_start not in s: raise SystemExit('start marker missing')
          s = s.replace(old_start, new_start, 1)

          old_finish = '''  function finishAssessment() {\n    const calculated = calculateScores(rawScores); const overall = calculateOverall(calculated); const recruitScore = calculateRecruitScore(calculated); const archetype = getArchetype(calculated);\n    const attempt: Attempt = { date: new Date().toISOString(), overall, recruitScore, archetype: archetype.name, scores: calculated, review: reviewRef.current };\n    const updated: PlayerProfile = { ...(profile as PlayerProfile), attempts: [...(profile?.attempts ?? []), attempt], bestOverall: Math.max(profile?.bestOverall ?? 0, overall), bestRecruitScore: Math.max(profile?.bestRecruitScore ?? 0, recruitScore) };\n    saveProfile(updated); setLatestScores(calculated); setLatestOverall(overall); setLatestRecruitScore(recruitScore); setLatestArchetype(archetype.name);\n    if (!isAdmin) setStatus({ isAdmin: false, canTakeAssessment: false, nextAssessmentAt: new Date(Date.now() + COOLDOWN_MS).toISOString() });\n    setView("results");\n  }'''
          new_finish = '''  async function finishAssessment() {\n    const calculated = calculateScores(rawScores); const overall = calculateOverall(calculated); const recruitScore = calculateRecruitScore(calculated); const archetype = getArchetype(calculated);\n    const attempt: Attempt = { date: new Date().toISOString(), overall, recruitScore, archetype: archetype.name, scores: calculated, review: reviewRef.current };\n    const updated: PlayerProfile = { ...(profile as PlayerProfile), attempts: [...(profile?.attempts ?? []), attempt], bestOverall: Math.max(profile?.bestOverall ?? 0, overall), bestRecruitScore: Math.max(profile?.bestRecruitScore ?? 0, recruitScore) };\n    saveProfile(updated);\n    try {\n      const response = await fetch("/api/profile", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ attempts: updated.attempts }) });\n      if (!response.ok) throw new Error("save failed");\n      const data = await response.json();\n      if (data.profile) { setProfile(data.profile); localStorage.setItem(STORAGE_KEY, JSON.stringify(data.profile)); }\n    } catch {\n      setStatusMessage("Your result could not be saved to the account yet. Please stay signed in and try again.");\n    }\n    localStorage.removeItem(DRAFT_STORAGE_KEY);\n    setDraftAvailable(false);\n    setLatestScores(calculated); setLatestOverall(overall); setLatestRecruitScore(recruitScore); setLatestArchetype(archetype.name);\n    if (!isAdmin) setStatus({ isAdmin: false, canTakeAssessment: false, nextAssessmentAt: new Date(Date.now() + COOLDOWN_MS).toISOString() });\n    setView("results");\n  }'''
          if old_finish not in s: raise SystemExit('finish block missing')
          s = s.replace(old_finish, new_finish, 1)

          old_button = '<button onClick={startAssessment} disabled={locked} className="mt-7 bg-red-600 hover:bg-red-700 disabled:bg-zinc-800 disabled:text-gray-600 px-8 py-4 rounded-xl font-black">{locked ? "TEST LOCKED" : "START 30-SCENARIO TEST →"}</button>'
          new_button = '<button onClick={startAssessment} disabled={locked} className="mt-7 bg-red-600 hover:bg-red-700 disabled:bg-zinc-800 disabled:text-gray-600 px-8 py-4 rounded-xl font-black">{locked ? "TEST LOCKED" : draftAvailable ? "RESUME TEST →" : "START 30-SCENARIO TEST →"}</button>'
          if old_button not in s: raise SystemExit('dashboard button missing')
          s = s.replace(old_button, new_button, 1)

          old_assessment_header = '<div className="flex justify-between items-end mb-3"><div><p className="text-xs font-bold tracking-[0.2em] text-red-500">ASSESSMENT</p><p className="text-sm text-gray-600 mt-1">{profile.name}</p></div><p className="text-sm font-bold">{current + 1}<span className="text-gray-600"> / {quizQuestions.length}</span></p></div>'
          new_assessment_header = '<div className="flex justify-between items-end mb-3"><div><p className="text-xs font-bold tracking-[0.2em] text-red-500">ASSESSMENT</p><p className="text-sm text-gray-600 mt-1">{profile.name}</p></div><div className="flex items-center gap-3"><p className="text-sm font-bold">{current + 1}<span className="text-gray-600"> / {quizQuestions.length}</span></p><button onClick={saveAndExit} className="bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 px-4 py-2 rounded-lg text-xs font-black">SAVE & EXIT</button></div></div>'
          if old_assessment_header not in s: raise SystemExit('assessment header missing')
          s = s.replace(old_assessment_header, new_assessment_header, 1)

          p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Apply assessment fixes"
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/apply-assessment-fixes.yml
          git commit -m "Remove one-time assessment patch workflow"
          git push
